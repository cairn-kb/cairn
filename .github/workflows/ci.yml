name: ci
on:
  pull_request:
    # Named explicitly, and the reason is the `no-release` label below. The
    # default set is [opened, synchronize, reopened] — `labeled` is NOT in it,
    # so adding the label the version job documents fired no run at all, and
    # the run already on the pull request carried a payload from before the
    # label existed. Re-running replays that original payload, so it failed
    # identically however many times you tried; only a fresh commit cleared it.
    #
    # `unlabeled` is the mirror and the more dangerous half: without it,
    # REMOVING `no-release` leaves the green run it produced standing, so the
    # check reports "no release needed" about a pull request that no longer
    # claims it. A stuck failure is visible; a stale pass is not.
    #
    # The first three have to be restated once `types` is named at all, or the
    # normal path stops running. The cost is that a label change re-runs the
    # whole suite; that is accepted rather than overlooked — pull requests here
    # are rarely labelled, and gating the test job on the action would make a
    # required check report as skipped, which is a subtler thing to get wrong
    # than a few minutes of runner time.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.6
      - run: bun install --frozen-lockfile
      - run: bun test
      # bun test does not typecheck.
      - run: bunx tsc --noEmit
      - name: Install gitleaks
        run: |
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz
          echo "cb49b7de5ee986510fe8666ca0273a6cc15eb82571f2f14832c9e8920751f3a4  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C /usr/local/bin gitleaks
          rm gitleaks.tar.gz
      # Every PR is a way for a secret to land in a public repo. Extra
      # patterns can be given with `--patterns <file>` or SCRUB_PATTERNS.
      - run: bun scripts/scrub-check.ts . --gitleaks
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck -s sh install.sh

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { fetch-depth: 0 }
      - name: Every commit is signed off
        env:
          BASE: ${{ github.base_ref }}
        run: |
          # --no-merges: actions/checkout on a pull_request checks out GitHub's
          # synthetic refs/pull/N/merge commit, which carries no Signed-off-by
          # of its own and would fail every PR regardless of its real commits.
          missing=$(git log --no-merges --format='%H %(trailers:key=Signed-off-by,valueonly)' "origin/$BASE..HEAD" | awk 'NF==1{print $1}')
          if [ -n "$missing" ]; then echo "Commits without Signed-off-by:"; echo "$missing"; echo "Use git commit -s (see CONTRIBUTING.md)."; exit 1; fi

  # A merge is not a release. A pull request describes what it changed under
  # `## [Unreleased]`; `bun run release` is the one place a version number is
  # ever chosen. That is not tidiness: when pull requests choose versions,
  # concurrent ones collide on a number and the merge order decides who owns
  # it. A merge that names no version cannot collide with another merge that
  # names none.
  #
  # This job therefore checks two things, and neither is a version bump:
  # the changelog gained an entry, and package.json did NOT move outside a
  # release branch.
  version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Require a changelog entry, and leave the version to the release
        env:
          BASE: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -eu
          # Deliberate escape hatch for the judgement calls a rule cannot make
          # (a revert, a rename, a comment). Visible in the PR either way.
          #
          # Adding the label now fires a run on its own, and removing it fires
          # another — see the `types:` list at the top of this file.
          # `test/ci-workflow.test.ts` executes the script below against real
          # git fixtures, including this branch: an escape hatch that is never
          # exercised is not known to work.
          case ",$LABELS," in
            *,no-release,*) echo "no-release label set — skipping the changelog check."; exit 0 ;;
          esac

          git fetch --no-tags origin "$BASE"
          before=$(git show "origin/$BASE:package.json" | jq -r .version)
          after=$(jq -r .version package.json)

          # The one branch that may move the version, and must. The pattern is
          # the exact shape `bun run release` creates — a branch merely ABOUT
          # releases (release-ritual, release-docs) must not be granted the
          # right to bump.
          case "$HEAD_REF" in
            release-[0-9]*.[0-9]*.[0-9]*)
              if [ "$before" = "$after" ]; then
                echo "A release branch must set a new version in package.json." >&2
                echo "Cut releases with: bun run release <x.y.z>" >&2
                exit 1
              fi
              if ! awk -v v="$after" 'index($0, "## [" v "]") == 1 { found = 1 } END { exit !found }' CHANGELOG.md; then
                echo "CHANGELOG.md has no '## [$after]' section for this release." >&2
                exit 1
              fi
              echo "Release branch: $before -> $after, described in CHANGELOG.md."
              exit 0 ;;
          esac

          if [ "$before" != "$after" ]; then
            echo "package.json went $before -> $after outside a release branch." >&2
            echo "Feature pull requests do not name a version: add your entry under" >&2
            echo "'## [Unreleased]' instead, and cut the release with 'bun run release'." >&2
            exit 1
          fi

          # Root src/ is what `bun build --compile` puts in the binary.
          changed=$(git diff --name-only "origin/$BASE...HEAD" -- src/ || true)
          if [ -z "$changed" ]; then
            echo "No CLI source changed — no changelog entry required."
            exit 0
          fi

          # Compared as a section rather than by grepping the diff: a PR that
          # edits an ALREADY-RELEASED section has not described its own change,
          # and a diff grep would count those lines.
          unreleased() { awk '/^## \[Unreleased\]/ { f = 1; next } /^## \[/ { f = 0 } f'; }
          base_section=$(git show "origin/$BASE:CHANGELOG.md" | unreleased || true)
          head_section=$(unreleased < CHANGELOG.md || true)
          if [ "$head_section" = "$base_section" ]; then
            echo "This PR changes the shipped CLI:" >&2
            echo "$changed" | sed 's/^/  /' >&2
            echo >&2
            echo "but adds nothing under '## [Unreleased]' in CHANGELOG.md." >&2
            echo "Describe the change for someone installing the binary — these lines" >&2
            echo "become the release notes — or add the 'no-release' label if this" >&2
            echo "genuinely ships nothing." >&2
            exit 1
          fi
          echo "CHANGELOG.md describes this change under [Unreleased]."
